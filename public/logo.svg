<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One zellige tile: an eight-pointed star (two overlapping squares) -->
    <pattern id="zellige" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect x="1.1" y="1.1" width="2.8" height="2.8" fill="#b08d57"/>
      <rect x="1.1" y="1.1" width="2.8" height="2.8" fill="#b08d57" transform="rotate(45 2.5 2.5)"/>
    </pattern>
    <!-- The arch band: outer arch minus inner doorway -->
    <clipPath id="band">
      <path clip-rule="evenodd" d="M10 60 V34 A23 23 0 1 1 54 34 V60 Z M18 60 V34 A15 15 0 1 1 46 34 V60 Z"/>
    </clipPath>
  </defs>

  <!-- Zellige tiles filling the arch band -->
  <rect width="64" height="64" fill="url(#zellige)" clip-path="url(#band)"/>

  <!-- Fine gold outlines framing the band -->
  <g fill="none" stroke="#b08d57" stroke-width="1.6" stroke-linejoin="round">
    <path d="M10 60 V34 A23 23 0 1 1 54 34 V60"/>
    <path d="M18 60 V34 A15 15 0 1 1 46 34 V60"/>
  </g>

  <!-- Keystone star at the top of the doorway -->
  <g fill="#b08d57">
    <rect x="28.5" y="21.5" width="7" height="7"/>
    <rect x="28.5" y="21.5" width="7" height="7" transform="rotate(45 32 25)"/>
  </g>
</svg>
